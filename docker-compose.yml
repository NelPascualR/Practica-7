
services:
  web:
    image: python:3.12-slim
    container_name: practica7_web
    working_dir: /app
    volumes:
      - ./src:/app
      - ./requirements.txt:/requirements.txt:ro
    ports:
      - "5000:5000"
    environment:
      DB_HOST: "db"
      DB_USER: "appuser"
      DB_PASSWORD: "app123"
      DB_NAME: "holamundo"
    command: sh -c "pip install --no-cache-dir -r /requirements.txt && python app.py"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: practica7_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "root123"
      MYSQL_DATABASE: "holamundo"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "app123"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
